
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Turbo Rivais — Corrida 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:white;font-family:Arial,sans-serif;text-align:center;overflow:hidden;touch-action:manipulation}
header{height:62px;display:flex;align-items:center;justify-content:center;gap:8px;background:#111c2c;border-bottom:2px solid #00e5ff}
header strong{font-size:21px;font-style:italic;color:#00e5ff}
header span{font-size:12px;color:#ffcf33}
#hud{display:flex;justify-content:space-around;padding:9px;font-weight:bold;background:#152237}
#game{display:block;width:100%;height:calc(100dvh - 210px);min-height:260px;max-height:620px}
#controls{display:flex;justify-content:center;gap:22px;padding:10px}
button{border:2px solid #00e5ff;border-radius:14px;background:#172b40;color:white;font-size:25px;font-weight:bold;width:82px;height:54px;touch-action: manipulation}
button:active{background:#00a9bd}
#start{width:auto;padding:0 22px;font-size:17px;background:#087b92}
#hint{font-size:12px;color:#9eb6ce;margin:2px}
</style>
</head>
<body>
<header><strong>🏁 TURBO RIVAIS</strong><span>3D RACING</span></header>
<div id="hud">
<span>🏆 <b id="score">0</b></span>
<span>⚡ <b id="speed">0</b> km/h</span>
<span>🥇 Recorde <b id="best">0</b></span>
</div>
<canvas id="game"></canvas>
<div id="controls">
<button id="left" aria-label="Virar à esquerda">◀</button>
<button id="start">INICIAR</button>
<button id="right" aria-label="Virar à direita">▶</button>
</div>
<div id="hint">Toque nas setas para desviar dos rivais.</div>
<script>
(()=>{
const c=document.getElementById('game'),ctx=c.getContext('2d');
const scoreEl=document.getElementById('score');
const speedEl=document.getElementById('speed');
const bestEl=document.getElementById('best');
let W=360,H=500,playing=false,score=0,speed=0,player=0;
let rivals=[],lines=0,last=0,spawn=0;
let best=0;
try{best=Number(localStorage.getItem('turboRivaisBest'))||0}catch(e){}
bestEl.textContent=best;
function resize(){
const r=c.getBoundingClientRect();
W=Math.max(300,r.width);H=Math.max(260,r.height);
c.width=Math.round(W*devicePixelRatio);
c.height=Math.round(H*devicePixelRatio);
ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
}
window.addEventListener('resize',resize);resize();
function road(y){
return W*.12+(y/H)*W*.76;
}
function drawCar(x,y,w,h,color,enemy=false){
ctx.save();ctx.translate(x,y);
ctx.fillStyle='rgba(0,0,0,.3)';
ctx.beginPath();ctx.ellipse(0,h*.46,w*.7,h*.18,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#111';
ctx.fillRect(-w*.52,-h*.3,w*.2,h*.34);
ctx.fillRect(w*.32,-h*.3,w*.2,h*.34);
ctx.fillRect(-w*.52,h*.12,w*.2,h*.34);
ctx.fillRect(w*.32,h*.12,w*.2,h*.34);
ctx.fillStyle=color;
ctx.beginPath();
ctx.moveTo(-w*.36,h*.45);ctx.lineTo(-w*.48,-h*.18);
ctx.lineTo(-w*.29,-h*.48);ctx.lineTo(w*.29,-h*.48);
ctx.lineTo(w*.48,-h*.18);ctx.lineTo(w*.36,h*.45);ctx.closePath();ctx.fill();
ctx.fillStyle=enemy?'#b9efff':'#8af7ff';
ctx.beginPath();
ctx.moveTo(-w*.25,-h*.15);ctx.lineTo(-w*.19,-h*.37);
ctx.lineTo(w*.19,-h*.37);ctx.lineTo(w*.25,-h*.15);ctx.closePath();ctx.fill();
ctx.fillStyle='#fff5a8';
ctx.fillRect(-w*.32,h*.29,w*.15,h*.07);
ctx.fillRect(w*.17,h*.29,w*.15,h*.07);
if(enemy){ctx.fillStyle='#fff';ctx.font=`bold ${Math.max(8,w*.32)}px Arial`;ctx.textAlign='center';ctx.fillText('R',0,h*.12)}
ctx.restore();
}
function background(){
let sky=ctx.createLinearGradient(0,0,0,H*.55);
sky.addColorStop(0,'#071329');sky.addColorStop(1,'#1b6380');
ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
ctx.fillStyle='#173d36';ctx.fillRect(0,H*.38,W,H*.62);
for(let i=0;i<22;i++){
let x=(i*97)%W,y=H*.27+(i%5)*H*.025;
ctx.fillStyle=i%2?'#1c3a52':'#244a55';
ctx.beginPath();ctx.moveTo(x,y+35);ctx.lineTo(x+17,y-12);ctx.lineTo(x+34,y+35);ctx.fill();
}
}
function draw(){
background();
const horizon=H*.22,bottom=H*1.05;
ctx.fillStyle='#484e58';
ctx.beginPath();ctx.moveTo(W*.44,horizon);ctx.lineTo(W*.56,horizon);ctx.lineTo(W*.94,bottom);ctx.lineTo(W*.06,bottom);ctx.closePath();ctx.fill();
ctx.fillStyle='#f4f4f4';
for(let i=0;i<24;i++){
let t=((i/24+lines)%1),y=horizon+t*(bottom-horizon);
let half=road(y)/2;
ctx.fillStyle=i%2?'#f6f6f6':'#ff364d';
ctx.fillRect(W/2-half-5,y,10,Math.max(2,H*.012));
ctx.fillRect(W/2+half-5,y,10,Math.max(2,H*.012));
}
for(let lane=1;lane<=2;lane++){
for(let i=0;i<12;i++){
let t=((i/12+lines*1.3)%1),y=horizon+t*(bottom-horizon);
let half=road(y)/2;
ctx.fillStyle='#d4dbe1';
ctx.fillRect(W/2-half+2*half*lane/3-2,y,4,Math.max(3,t*H*.04));
}
}
rivals.forEach(r=>{
const y=horizon+r.z*(H*.84),half=road(y)/2;
const x=W/2+(r.lane*0.66)*half;
const scale=.22+r.z*.8;
drawCar(x,y,27*scale,49*scale,r.color,true);
});
const py=H*.81,half=road(py)/2;
drawCar(W/2+player*half*.72,py,36,65,'#00d9ff');
if(!playing){
ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,H*.38,W,H*.23);
ctx.fillStyle='#fff';ctx.textAlign='center';
ctx.font='bold 25px Arial';ctx.fillText(score?'FIM DE CORRIDA':'PRONTO PARA CORRER?',W/2,H*.47);
ctx.font='16px Arial';ctx.fillText(score?'Toque em INICIAR para tentar de novo':'Toque em INICIAR!',W/2,H*.53);
}
}
function endGame(){
playing=false;
if(score>best){best=score;bestEl.textContent=best;
try{localStorage.setItem('turboRivaisBest',best)}catch(e){}}
document.getElementById('start').textContent='RECOMEÇAR';
draw();
}
function start(){
score=0;speed=120;player=0;rivals=[];lines=0;spawn=0;
playing=true;last=performance.now();
scoreEl.textContent='0';speedEl.textContent=speed;
document.getElementById('start').textContent='REINICIAR';
requestAnimationFrame(loop);
}
function move(d){if(playing)player=Math.max(-.82,Math.min(.82,player+d))}
document.getElementById('left').addEventListener('pointerdown',()=>move(-.22));
document.getElementById('right').addEventListener('pointerdown',()=>move(.22));
document.getElementById('start').addEventListener('click',start);
function loop(now){
if(!playing)return;
let dt=Math.min((now-last)/1000,.04);last=now;
score+=Math.round(dt*10);
speed=Math.min(280,120+Math.floor(score/4));
lines=(lines+dt*(.35+speed/120))%1;
spawn+=dt;
if(spawn>1.05){spawn=0;rivals.push({lane:Math.floor(Math.random()*3)-1,z:.02,color:['#ff334f','#ffc928','#a35cff','#54ed80'][Math.floor(Math.random()*4)]})}
rivals.forEach(r=>r.z+=dt*(.20+speed/650));
rivals=rivals.filter(r=>r.z<1.08);
for(const r of rivals){
if(r.z>.78&&r.z<.96&&Math.abs(r.lane*.66-player*.72)<.24){endGame();return}
}
scoreEl.textContent=score;speedEl.textContent=speed;
draw();requestAnimationFrame(loop);
}
draw();
})();
</script>
</body>
</html>
